      delivery: "CMS do Blog mapeado; D07-PH-1401 encerrada"
      notes: "Semana Crítica: Blog entra em paralelo à Fase Zero, com pré-requisito de tarefa ainda aberto (ver pendência 2)."

    - day: "QUI 17"
      objective: "Fechar orçamento e identidade de marca"
