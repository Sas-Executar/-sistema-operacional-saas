# SEMANA 01 — Sprint operacional
# Preenchido conforme o contrato de conteúdo definido por você.
# Fontes: Fase Zero (D07-PH-1400 a 1403, Linear EXE-29/30/31/32) +
#         caminho crítico da semana (Blog/Vera/Loja de Ferramentas, Linear EXE-121/131/136) +
#         tema por dia do corpus original (ROADMAP.md, Sprint 01, CORPUS_DIRECT).
# Nenhum item abaixo foi inventado: cada ação referencia uma issue real do Linear.
# Itens sem lastro no corpus (ex.: Campanha de Lançamento 01) estão marcados como PENDÊNCIA, não preenchidos por inferência.

sprint:
