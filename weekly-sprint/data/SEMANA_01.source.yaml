      actions:
        - index: "01"
          text: "Publicar matriz e checkpoint de retomada"
          ref: "EXE-59"
        - index: "02"
          text: "Verificar espelhos e referências externas"
          ref: "EXE-60"
        - index: "03"
          text: "Inventariar variáveis por app e pacote"
          ref: "EXE-61"
      delivery: "Matriz publicada; D07-PH-1400 encerrada"
      notes: "Abre a semana. Sem pré-requisito pendente."

